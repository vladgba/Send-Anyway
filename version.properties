# App version (semantic versioning: MAJOR.MINOR.PATCH).
#   MAJOR - incompatible changes, MINOR - new features, PATCH - bug fixes
# Edit by hand or run: gradlew bumpPatch | bumpMinor | bumpMajor
# versionCode = MAJOR*10000 + MINOR*100 + PATCH, so MINOR and PATCH must stay below 100.
major=0
minor=1
patch=0
